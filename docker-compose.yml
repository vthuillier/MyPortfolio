services:
  # Application PHP
  app:
    build: .
    container_name: portfolio_app
    ports:
      - "8080:80"
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
      - ./database:/var/www/html/database # Pour SQLite si besoin
    environment:
      # Par défaut PostgreSQL, décommentez MariaDB si vous préférez
      - DB_CONNECTION=pgsql
      - DB_HOST=db_postgres
      - DB_PORT=5432
      - DB_DATABASE=portfolio_db
      - DB_USERNAME=portfolio_admin
      - DB_PASSWORD=portfolio_secure_pass
      
      # Configuration MariaDB alternative
      # - DB_CONNECTION=mysql
      # - DB_HOST=db_mariadb
      # - DB_PORT=3306
      # - DB_DATABASE=portfolio_db
      # - DB_USERNAME=portfolio_user
      # - DB_PASSWORD=portfolio_pass
    depends_on:
      - db_postgres

  # Base de données PostgreSQL
  db_postgres:
    image: postgres:15-alpine
    container_name: portfolio_db_postgres
    environment:
      - POSTGRES_DB=portfolio_db
      - POSTGRES_USER=portfolio_admin
      - POSTGRES_PASSWORD=portfolio_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_admin -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optionnel : Base de données MariaDB
  # db_mariadb:
  #   image: mariadb:10.11
  #   container_name: portfolio_db_mariadb
  #   environment:
  #     - MARIADB_DATABASE=portfolio_db
  #     - MARIADB_USER=portfolio_user
  #     - MARIADB_PASSWORD=portfolio_pass
  #     - MARIADB_ROOT_PASSWORD=root_pass
  #   volumes:
  #     - mariadb_data:/var/lib/mysql

volumes:
  # Volumes de sauvegarde persistants
  pgdata:
    driver: local
  mariadb_data:
    driver: local
